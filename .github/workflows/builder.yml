name: Publish isolated builder image
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  builder:
    if: github.repository == 'mochiOS/libs' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install the pinned Meson parser for cross-file tests
        run: |
          python3 -m pip install --no-deps --only-binary=:all: --require-hashes -r tooling/host-requirements.txt
          python3 tools/prepare_meson.py
      - run: python3 tools/libs.py check
      - run: python3 -m unittest discover -s tests -v
      - name: Build only trusted repository-owned host tooling
        run: |
          RUNNER_HASH=$(python3 -c 'import sys; sys.path.insert(0,"tools"); import libs; print(libs.runner_identity(libs.ROOT))')
          docker build --build-arg "LIBS_RUNNER_SHA256=$RUNNER_HASH" --label "org.opencontainers.image.source=https://github.com/mochiOS/libs" --label "org.opencontainers.image.revision=$GITHUB_SHA" -t "ghcr.io/mochios/libs-builder:sha-$GITHUB_SHA" .
      - name: Publish builder and report immutable digest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "ghcr.io/mochios/libs-builder:sha-$GITHUB_SHA"
          docker image inspect "ghcr.io/mochios/libs-builder:sha-$GITHUB_SHA" --format '{{json .RepoDigests}}' >> "$GITHUB_STEP_SUMMARY"
