name: Build libraries and approve publication
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sdk_candidate:
        description: Verify ports using the reviewed unpublished SDK artifact (cannot publish)
        type: boolean
        default: false
concurrency:
  group: library-${{ inputs.sdk_candidate == true && 'verification' || 'releases' }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  plan:
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    outputs:
      sdk_ready: ${{ steps.plan.outputs.sdk_ready }}
      needs_build: ${{ steps.plan.outputs.needs_build }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install the pinned Meson parser for cross-file tests
        run: |
          python3 -m pip install --no-deps --only-binary=:all: --require-hashes -r tooling/host-requirements.txt
          python3 tools/prepare_meson.py
      - run: python3 tools/libs.py check
      - run: python3 -m unittest discover -s tests -v
      - name: Prepare reviewed development SDK
        if: inputs.sdk_candidate == true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/sdk_candidate.py fetch
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/libs.py plan --check-releases --github-output "$GITHUB_OUTPUT"
      - name: Explain SDK readiness
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          plan = json.loads(Path('out/plan.json').read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(('New build inputs detected.\n' if plan['needs_build'] else 'All selected build revisions are already published.\n') if plan['ready'] else '**Build/publication blocked:** ' + plan['blocked_reason'] + '\n')
              for name, reason in plan.get('blocked_ports', {}).items():
                  summary.write(f'**{name} remains unavailable:** {reason}\n')
              for item in plan['packages']:
                  summary.write(f"- {item['release']}: `{item['source']['commit']}`\n")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frozen-plan
          path: |
            out/plan.json
            out/sdk-candidate
          if-no-files-found: error
          retention-days: 7
  build:
    needs: plan
    if: needs.plan.outputs.sdk_ready == 'true' && needs.plan.outputs.needs_build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: frozen-plan
          path: out
      - name: Restore reviewed development SDK
        if: inputs.sdk_candidate == true
        run: python3 tools/sdk_candidate.py restore
      - name: Authenticate only the host runner for the pinned builder image
        env:
          GH_TOKEN: ${{ github.token }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Build without mounting the OS workspace
        env:
          GH_TOKEN: ${{ github.token }} # Read-only release cache access; not passed into containers.
        run: python3 tools/libs.py build
      - name: Retain cross-build failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: library-build-logs
          path: |
            out/builds/**/container.log
            out/builds/**/build/config.log
            out/builds/**/build/meson-logs/**
            out/builds/**/build/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: ignore
          retention-days: 7
      - run: python3 tools/releases.py verify
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-libraries
          path: out/releases
          if-no-files-found: error
          retention-days: 7

  release-policy:
    name: Verify release approval policy
    needs: plan
    if: inputs.sdk_candidate != true && github.ref == 'refs/heads/main' && needs.plan.outputs.sdk_ready == 'true' && needs.plan.outputs.needs_build == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Require configured reviewers before publication can be scheduled
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/release_approval.py

  release:
    name: Publish verified libraries after approval
    needs: [plan, build, release-policy]
    if: inputs.sdk_candidate != true && github.repository == 'mochiOS/libs' && github.ref == 'refs/heads/main' && needs.plan.outputs.needs_build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: library-release
      url: https://github.com/mochiOS/libs/releases
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: frozen-plan
          path: out
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-libraries
          path: out/releases
      - name: Recheck approval protection after the job is approved
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/release_approval.py
      - name: Reverify the exact build artifacts
        run: python3 tools/releases.py verify
      - name: Publish the approved library plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/releases.py publish
      - name: Link the published libraries
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          plan = json.loads(Path('out/plan.json').read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('## Published libraries\n\n')
              for package in plan['packages']:
                  tag = package['release']
                  summary.write(f'- [{tag}](https://github.com/mochiOS/libs/releases/tag/{tag})\n')
          PY
