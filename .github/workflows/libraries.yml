name: Track, build and release libraries
on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:
concurrency:
  group: library-releases
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      sdk_ready: ${{ steps.plan.outputs.sdk_ready }}
      needs_build: ${{ steps.plan.outputs.needs_build }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python3 tools/libs.py check
      - run: python3 -m unittest discover -s tests -v
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/libs.py plan --refresh --check-releases --github-output "$GITHUB_OUTPUT"
      - name: Explain SDK readiness
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          plan = json.loads(Path('out/plan.json').read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(('New build inputs detected.\n' if plan['needs_build'] else 'All selected build revisions are already published.\n') if plan['ready'] else '**Build/publication blocked:** ' + plan['blocked_reason'] + '\n')
              for item in plan['packages']:
                  summary.write(f"- {item['release']}: `{item['source']['commit']}`\n")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frozen-plan
          path: out/plan.json
          if-no-files-found: error
          retention-days: 7
  build:
    needs: plan
    if: needs.plan.outputs.sdk_ready == 'true' && needs.plan.outputs.needs_build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: frozen-plan
          path: out
      - name: Authenticate only the host runner for the pinned builder image
        env:
          GH_TOKEN: ${{ github.token }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Build without mounting the OS workspace
        env:
          GH_TOKEN: ${{ github.token }} # Read-only release cache access; not passed into containers.
        run: python3 tools/libs.py build
      - name: Retain cross-build failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: library-build-logs
          path: |
            out/builds/**/container.log
            out/builds/**/build/config.log
            out/builds/**/build/meson-logs/**
            out/builds/**/build/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: ignore
          retention-days: 7
      - run: python3 tools/releases.py verify
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-libraries
          path: out/releases
          if-no-files-found: error
          retention-days: 7
