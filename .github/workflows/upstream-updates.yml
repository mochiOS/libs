name: Propose upstream library updates
on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:
concurrency:
  group: upstream-library-updates
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  scan:
    name: Detect and freeze upstream releases
    if: github.repository == 'mochiOS/libs' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      updates_available: ${{ steps.scan.outputs.updates_available }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - id: scan
        run: python3 tools/upstream_updates.py scan --github-output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.scan.outputs.updates_available == 'true'
        with:
          name: upstream-proposal
          path: out/upstream-proposal
          if-no-files-found: error
          retention-days: 7

  validate:
    name: Test and cross-build the candidate registry
    needs: scan
    if: needs.scan.outputs.updates_available == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: upstream-proposal
          path: out/upstream-proposal
      - run: python3 tools/upstream_updates.py apply
      - name: Install the pinned Meson parser for cross-file tests
        run: |
          python3 -m pip install --no-deps --only-binary=:all: --require-hashes -r tooling/host-requirements.txt
          python3 tools/prepare_meson.py
      - run: python3 tools/libs.py check
      - run: python3 -m unittest discover -s tests -v
      - run: python3 tools/libs.py plan
      - name: Authenticate the read-only host runner for the pinned builder
        env:
          GH_TOKEN: ${{ github.token }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Build candidates without publication credentials
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/libs.py build
      - run: python3 tools/releases.py verify
      - name: Retain candidate build evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: upstream-validation-logs
          path: |
            out/builds/**/container.log
            out/builds/**/build/config.log
            out/builds/**/build/meson-logs/**
            out/builds/**/build/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: ignore
          retention-days: 7

  pull-request:
    name: Open or reuse the maintainer update PR
    needs: [scan, validate]
    if: always() && !cancelled() && needs.scan.result == 'success' && needs.scan.outputs.updates_available == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      statuses: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: upstream-proposal
          path: out/upstream-proposal
      - name: Mention maintainers and attach the actual candidate validation result
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RESULT: ${{ needs.validate.result }}
        run: python3 tools/upstream_updates.py pull-request --result "$CANDIDATE_RESULT"
