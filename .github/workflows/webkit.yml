name: Validate and build independent WebKit engine
on:
  pull_request:
    paths: ['engines/webkit/**', 'tools/webkit*.py', 'tests/test_webkit*.py', '.github/workflows/webkit.yml', 'libraries.toml', 'sources.lock.json', 'sdk.lock.toml']
  push:
    branches: [main]
    paths: ['engines/webkit/**', 'tools/webkit*.py', 'tests/test_webkit*.py', '.github/workflows/webkit.yml', 'libraries.toml', 'sources.lock.json', 'sdk.lock.toml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: webkit-${{ github.ref }}
  cancel-in-progress: false
jobs:
  contract:
    name: C ABI tests and native readiness (not an engine build)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      ready: ${{ steps.plan.outputs.ready }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tests -p 'test_webkit*.py' -v
      - run: cmake -S engines/webkit -B out/webkit-abi -DBUILD_TESTING=ON
      - run: cmake --build out/webkit-abi --parallel 2
      - run: ctest --test-dir out/webkit-abi --output-on-failure
      - id: plan
        run: python3 tools/webkit_ci.py plan --output out/webkit --github-output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: webkit-readiness
          path: out/webkit/plan.json
          if-no-files-found: error
          retention-days: 7
  build:
    name: Cross-build real mochiOS WebKit candidate
    needs: contract
    if: github.ref == 'refs/heads/main' && needs.contract.outputs.ready == 'true'
    runs-on: ${{ fromJSON(vars.WEBKIT_BUILD_RUNNER || '["ubuntu-24.04"]') }}
    timeout-minutes: 350
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Authenticate host for pinned builder image only
        env:
          GH_TOKEN: ${{ github.token }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Build SDK-locked dependencies and isolated WebKit candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/webkit_ci.py build --output out/webkit
      - name: Retain actual failure diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: webkit-build-logs
          path: |
            out/webkit/plan.json
            out/webkit/container.log
            out/webkit/work/**/*.log
            out/webkit/work/**/doctor.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Save developer candidate, never publish
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: webkit-cross-build-candidate
          path: |
            out/webkit/work/candidate.json
            out/webkit/work/webkit-candidate.tar.gz
          if-no-files-found: error
          retention-days: 7
