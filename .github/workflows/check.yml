name: Validate library infrastructure
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install the pinned Meson parser for cross-file tests
        run: |
          python3 -m pip install --no-deps --only-binary=:all: --require-hashes -r tooling/host-requirements.txt
          python3 tools/prepare_meson.py
      - run: python3 tools/libs.py check
      - run: python3 -m unittest discover -s tests -v
