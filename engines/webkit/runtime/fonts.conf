<?xml version="1.0"?>
<fontconfig>
  <!-- Fonts are measured assets in this Web process's immutable resource view.
       No HOME, /usr tree, downloaded configuration or global writable cache. -->
  <dir prefix="relative">fonts</dir>
  <alias><family>sans-serif</family><prefer><family>Inter Variable</family><family>IBM Plex Sans JP</family></prefer></alias>
  <alias><family>monospace</family><prefer><family>UDEV Gothic</family></prefer></alias>
</fontconfig>
