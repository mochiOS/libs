<?xml version="1.0"?>
<fontconfig>
  <!-- System fonts are immutable and readable by the sandboxed Web process.
       No HOME, /usr tree, downloaded configuration or global writable cache. -->
  <dir>/system/libraries/fonts</dir>
  <alias><family>sans-serif</family><prefer><family>Inter</family><family>IBM Plex Sans JP</family></prefer></alias>
  <alias><family>monospace</family><prefer><family>UDEV Gothic</family></prefer></alias>
</fontconfig>
