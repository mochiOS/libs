format = 1

[distribution]
repository = "mochiOS/libs"
target = "x86_64-unknown-mochios"
abi = "mochios-1"
prerelease = true

[libraries.zlib]
git = "https://github.com/madler/zlib.git"
tag_pattern = '^v(?P<version>[0-9]+\.[0-9]+\.[0-9]+)$'
revision = 7
enabled = true
recipe = "recipes/zlib/recipe.json"
dependencies = []

[libraries.libpng]
git = "https://github.com/pnggroup/libpng.git"
tag_pattern = '^v(?P<version>1\.6\.[0-9]+)$'
revision = 7
enabled = true
recipe = "recipes/libpng/recipe.json"
dependencies = ["zlib"]

[libraries.pcre2]
git = "https://github.com/PCRE2Project/pcre2.git"
tag_pattern = '^pcre2-(?P<version>[0-9]+\.[0-9]+)$'
revision = 5
enabled = true
recipe = "recipes/pcre2/recipe.json"
dependencies = []
submodules = { "deps/sljit" = { git = "https://github.com/zherczeg/sljit.git", commit = "de0259c7aaf36aa40cba8014f3fad3edde9307f9" } }

[libraries.libffi]
git = "https://github.com/libffi/libffi.git"
tag_pattern = '^v(?P<version>[0-9]+\.[0-9]+\.[0-9]+)$'
revision = 5
enabled = true
recipe = "recipes/libffi/recipe.json"
dependencies = []

[libraries.libiconv]
git = "https://https.git.savannah.gnu.org/git/libiconv.git"
tag_pattern = '^v(?P<version>[0-9]+\.[0-9]+(?:\.[0-9]+)?)$'
source_archive = "https://ftp.gnu.org/gnu/libiconv/libiconv-{version}.tar.gz"
revision = 5
enabled = true
recipe = "recipes/libiconv/recipe.json"
dependencies = []

[libraries.gettext-runtime]
git = "https://https.git.savannah.gnu.org/git/gettext.git"
tag_pattern = '^v(?P<version>[0-9]+\.[0-9]+(?:\.[0-9]+)?)$'
source_archive = "https://ftp.gnu.org/gnu/gettext/gettext-{version}.tar.gz"
revision = 6
enabled = true
recipe = "recipes/gettext-runtime/recipe.json"
dependencies = ["libiconv"]

[libraries.glib]
git = "https://gitlab.gnome.org/GNOME/glib.git"
tag_pattern = '^(?P<version>2\.[0-9]*[02468]\.[0-9]+)$'
revision = 8
enabled = true
recipe = "recipes/glib/recipe.json"
dependencies = ["zlib", "pcre2", "libffi", "libiconv", "gettext-runtime"]
submodules = { "subprojects/gvdb" = { git = "https://gitlab.gnome.org/GNOME/gvdb.git", commit = "2b42fc75f09dbe1cd1057580b5782b08f2dcb400" } }

[libraries.libjpeg-turbo]
git = "https://github.com/libjpeg-turbo/libjpeg-turbo.git"
tag_pattern = '^(?P<version>[0-9]+\.[0-9]+\.[0-9]+)$'
revision = 5
enabled = true
recipe = "recipes/libjpeg-turbo/recipe.json"
dependencies = []

[libraries.libwebp]
git = "https://github.com/webmproject/libwebp.git"
tag_pattern = '^v(?P<version>[0-9]+\.[0-9]+\.[0-9]+)$'
revision = 5
enabled = true
recipe = "recipes/libwebp/recipe.json"
dependencies = []

[libraries.brotli]
git = "https://github.com/google/brotli.git"
tag_pattern = '^v(?P<version>[0-9]+\.[0-9]+\.[0-9]+)$'
revision = 5
enabled = true
recipe = "recipes/brotli/recipe.json"
dependencies = []

[libraries.libxml2]
git = "https://gitlab.gnome.org/GNOME/libxml2.git"
tag_pattern = '^v(?P<version>[0-9]+\.[0-9]+\.[0-9]+)$'
revision = 5
enabled = true
recipe = "recipes/libxml2/recipe.json"
dependencies = ["libiconv"]

[libraries.freetype]
git = "https://github.com/freetype/freetype.git"
tag_pattern = '^VER-(?P<version>[0-9]+-[0-9]+-[0-9]+)$'
revision = 5
enabled = true
recipe = "recipes/freetype/recipe.json"
dependencies = ["zlib", "libpng", "brotli"]
submodules = { "subprojects/dlg" = { git = "https://github.com/nyorain/dlg.git", commit = "395ccad2c1e0daae535c4d20bb0a3f2424648e17" } }

[libraries.nghttp2]
git = "https://github.com/nghttp2/nghttp2.git"
tag_pattern = '^v(?P<version>1\.[0-9]+\.[0-9]+)$'
source_archive = "https://github.com/nghttp2/nghttp2/archive/refs/tags/v{version}.tar.gz"
revision = 4
enabled = true
recipe = "recipes/nghttp2/recipe.json"
dependencies = []

[libraries.sqlite]
git = "https://github.com/sqlite/sqlite.git"
tag_pattern = '^version-(?P<version>3\.[0-9]+\.[0-9]+)$'
revision = 4
enabled = true
recipe = "recipes/sqlite/recipe.json"
dependencies = []

[libraries.libunistring]
git = "https://https.git.savannah.gnu.org/git/libunistring.git"
tag_pattern = '^v(?P<version>[0-9]+\.[0-9]+(?:\.[0-9]+)?)$'
source_archive = "https://ftp.gnu.org/gnu/libunistring/libunistring-{version}.tar.gz"
revision = 3
enabled = true
recipe = "recipes/libunistring/recipe.json"
dependencies = ["libiconv"]

[libraries.libidn2]
git = "https://gitlab.com/libidn/libidn2.git"
tag_pattern = '^v(?P<version>[0-9]+\.[0-9]+\.[0-9]+)$'
source_archive = "https://ftp.gnu.org/gnu/libidn/libidn2-{version}.tar.gz"
revision = 3
enabled = true
recipe = "recipes/libidn2/recipe.json"
dependencies = ["libunistring", "libiconv"]

[libraries.libpsl]
git = "https://github.com/rockdaboot/libpsl.git"
tag_pattern = '^(?P<version>[0-9]+\.[0-9]+\.[0-9]+)$'
revision = 3
enabled = true
recipe = "recipes/libpsl/recipe.json"
dependencies = ["libidn2", "libunistring", "libiconv"]
submodules = { "list" = { git = "https://github.com/publicsuffix/list", commit = "e1b8015c3b2f0f4f8c18659c2480fc1a22c07b20" } }

[libraries.libsoup]
git = "https://gitlab.gnome.org/GNOME/libsoup.git"
tag_pattern = '^(?P<version>3\.[0-9]*[02468]\.[0-9]+)$'
revision = 2
enabled = false
reason = "Native GIO TLS provider is implemented but requires the unpublished SDK TLS archive and mochiOS runtime verification"
recipe = "recipes/libsoup/recipe.json"
dependencies = ["glib", "glib-networking", "nghttp2", "sqlite", "libpsl", "zlib"]

# Planned ports are visible but never advertised as buildable/published.
[libraries.webkit]
git = "https://github.com/WebKit/WebKit.git"
tag_pattern = '^wpewebkit-(?P<version>[0-9]+\.[0-9]*[02468]\.[0-9]+)$'
revision = 2
enabled = false
reason = "WebKit platform integration and its full dependency graph are not ported"
dependencies = ["glib", "libpng"]

[libraries.glib-networking]
git = "https://gitlab.gnome.org/GNOME/glib-networking.git"
tag_pattern = '^(?P<version>2\.[0-9]*[02468]\.[0-9]+)$'
revision = 1
enabled = false
recipe = "recipes/glib-networking/recipe.json"
dependencies = ["glib"]
reason = "Native TLS provider cross-linked and host-tested; requires an unpublished SDK TLS archive and mochiOS runtime verification."

[libraries.expat]
git = "https://github.com/libexpat/libexpat.git"
tag_pattern = '^R_(?P<version>[0-9]+_[0-9]+_[0-9]+)$'
revision = 2
enabled = true
recipe = "recipes/expat/recipe.json"
dependencies = []

[libraries.fontconfig]
git = "https://gitlab.freedesktop.org/fontconfig/fontconfig.git"
tag_pattern = '^(?P<version>2\.[0-9]+\.[0-9]+)$'
revision = 2
enabled = true
recipe = "recipes/fontconfig/recipe.json"
dependencies = ["expat", "freetype"]

[libraries.icu]
git = "https://github.com/unicode-org/icu.git"
tag_pattern = '^release-(?P<version>[0-9]+-[0-9]+)$'
source_archive = "https://github.com/unicode-org/icu/releases/download/release-{version_dash}/icu4c-{version_underscore}-src.tgz"
revision = 2
enabled = true
recipe = "recipes/icu/recipe.json"
dependencies = []

[libraries.harfbuzz]
git = "https://github.com/harfbuzz/harfbuzz.git"
tag_pattern = '^(?P<version>[0-9]+\.[0-9]+\.[0-9]+)$'
source_archive = "https://github.com/harfbuzz/harfbuzz/releases/download/{version}/harfbuzz-{version}.tar.xz"
revision = 3
enabled = true
recipe = "recipes/harfbuzz/recipe.json"
dependencies = ["freetype", "glib", "icu"]

[libraries.libgpg-error]
git = "https://github.com/gpg/libgpg-error.git"
tag_pattern = '^libgpg-error-(?P<version>[0-9]+\.[0-9]+)$'
source_archive = "https://gnupg.org/ftp/gcrypt/libgpg-error/libgpg-error-{version}.tar.bz2"
revision = 2
enabled = true
recipe = "recipes/libgpg-error/recipe.json"
dependencies = []

[libraries.libgcrypt]
git = "https://github.com/gpg/libgcrypt.git"
tag_pattern = '^libgcrypt-(?P<version>1\.[0-9]*[02468]\.[0-9]+)$'
source_archive = "https://gnupg.org/ftp/gcrypt/libgcrypt/libgcrypt-{version}.tar.bz2"
revision = 2
enabled = true
recipe = "recipes/libgcrypt/recipe.json"
dependencies = ["libgpg-error"]

[libraries.libtasn1]
git = "https://gitlab.com/gnutls/libtasn1.git"
tag_pattern = '^v(?P<version>[0-9]+\.[0-9]+\.[0-9]+)$'
source_archive = "https://ftp.gnu.org/gnu/libtasn1/libtasn1-{version}.tar.gz"
revision = 2
enabled = true
recipe = "recipes/libtasn1/recipe.json"
dependencies = []
