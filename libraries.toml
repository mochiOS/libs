format = 1

[distribution]
repository = "mochiOS/libs"
target = "x86_64-unknown-mochios"
abi = "mochios-1"
prerelease = true

[libraries.zlib]
git = "https://github.com/madler/zlib.git"
tag_pattern = '^v(?P<version>[0-9]+\.[0-9]+\.[0-9]+)$'
revision = 3
enabled = true
recipe = "recipes/zlib/recipe.json"
dependencies = []

[libraries.libpng]
git = "https://github.com/pnggroup/libpng.git"
tag_pattern = '^v(?P<version>1\.6\.[0-9]+)$'
revision = 3
enabled = true
recipe = "recipes/libpng/recipe.json"
dependencies = ["zlib"]

[libraries.pcre2]
git = "https://github.com/PCRE2Project/pcre2.git"
tag_pattern = '^pcre2-(?P<version>[0-9]+\.[0-9]+)$'
revision = 1
enabled = true
recipe = "recipes/pcre2/recipe.json"
dependencies = []
submodules = { "deps/sljit" = { git = "https://github.com/zherczeg/sljit.git", commit = "de0259c7aaf36aa40cba8014f3fad3edde9307f9" } }

[libraries.libffi]
git = "https://github.com/libffi/libffi.git"
tag_pattern = '^v(?P<version>[0-9]+\.[0-9]+\.[0-9]+)$'
revision = 1
enabled = true
recipe = "recipes/libffi/recipe.json"
dependencies = []

[libraries.libiconv]
git = "https://https.git.savannah.gnu.org/git/libiconv.git"
tag_pattern = '^v(?P<version>[0-9]+\.[0-9]+(?:\.[0-9]+)?)$'
source_archive = "https://ftp.gnu.org/gnu/libiconv/libiconv-{version}.tar.gz"
revision = 1
enabled = true
recipe = "recipes/libiconv/recipe.json"
dependencies = []

[libraries.gettext-runtime]
git = "https://https.git.savannah.gnu.org/git/gettext.git"
tag_pattern = '^v(?P<version>[0-9]+\.[0-9]+(?:\.[0-9]+)?)$'
source_archive = "https://ftp.gnu.org/gnu/gettext/gettext-{version}.tar.gz"
revision = 1
enabled = true
recipe = "recipes/gettext-runtime/recipe.json"
dependencies = ["libiconv"]

[libraries.glib]
git = "https://gitlab.gnome.org/GNOME/glib.git"
tag_pattern = '^(?P<version>2\.[0-9]*[02468]\.[0-9]+)$'
revision = 2
enabled = false
reason = "SDK shared.2 lacks ARPA/resolv headers and res_query; native DNS authority currently supports A/AAAA/PTR only"
recipe = "recipes/glib/recipe.json"
dependencies = ["zlib", "pcre2", "libffi", "libiconv", "gettext-runtime"]
submodules = { "subprojects/gvdb" = { git = "https://gitlab.gnome.org/GNOME/gvdb.git", commit = "2b42fc75f09dbe1cd1057580b5782b08f2dcb400" } }

[libraries.libjpeg-turbo]
git = "https://github.com/libjpeg-turbo/libjpeg-turbo.git"
tag_pattern = '^(?P<version>[0-9]+\.[0-9]+\.[0-9]+)$'
revision = 1
enabled = true
recipe = "recipes/libjpeg-turbo/recipe.json"
dependencies = []

[libraries.libwebp]
git = "https://github.com/webmproject/libwebp.git"
tag_pattern = '^v(?P<version>[0-9]+\.[0-9]+\.[0-9]+)$'
revision = 1
enabled = true
recipe = "recipes/libwebp/recipe.json"
dependencies = []

[libraries.brotli]
git = "https://github.com/google/brotli.git"
tag_pattern = '^v(?P<version>[0-9]+\.[0-9]+\.[0-9]+)$'
revision = 1
enabled = true
recipe = "recipes/brotli/recipe.json"
dependencies = []

[libraries.libxml2]
git = "https://gitlab.gnome.org/GNOME/libxml2.git"
tag_pattern = '^v(?P<version>[0-9]+\.[0-9]+\.[0-9]+)$'
revision = 1
enabled = true
recipe = "recipes/libxml2/recipe.json"
dependencies = ["libiconv"]

[libraries.freetype]
git = "https://github.com/freetype/freetype.git"
tag_pattern = '^VER-(?P<version>[0-9]+-[0-9]+-[0-9]+)$'
revision = 1
enabled = true
recipe = "recipes/freetype/recipe.json"
dependencies = ["zlib", "libpng", "brotli"]
submodules = { "subprojects/dlg" = { git = "https://github.com/nyorain/dlg.git", commit = "395ccad2c1e0daae535c4d20bb0a3f2424648e17" } }

# Planned ports are visible but never advertised as buildable/published.
[libraries.webkit]
git = "https://github.com/WebKit/WebKit.git"
tag_pattern = '^wpewebkit-(?P<version>[0-9]+\.[0-9]*[02468]\.[0-9]+)$'
revision = 2
enabled = false
reason = "WebKit platform integration and its full dependency graph are not ported"
dependencies = ["glib", "libpng"]
